name: p12-lock-refresh-helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-aiohttp-lock:
    if: github.head_ref == 'research/cpi-p12-reliability-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Refresh aiohttp lock entry
        run: uv lock --upgrade-package aiohttp
      - name: Commit lock refresh if needed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "aiohttp lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh aiohttp lock for current security advisory"
          git push origin "HEAD:${{ github.head_ref }}"
