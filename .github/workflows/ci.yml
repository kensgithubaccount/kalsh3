name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Install CI verification tools
        run: uv pip install ruff mypy pytest
      - name: Frozen V3 high-FD negative control
        run: |
          git worktree add --detach "$RUNNER_TEMP/wn-v3-baseline" 3cd2695592e10132ed54773ccb9d0fbfbcbe635f
          git -C "$RUNNER_TEMP/wn-v3-baseline" rev-parse HEAD HEAD^{tree}
          set +e
          (cd "$RUNNER_TEMP/wn-v3-baseline" && sh "$GITHUB_WORKSPACE/scripts/ci_offline_tests.sh" "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/wn_v3_high_fd_suite.py") > "$RUNNER_TEMP/wn-v3-baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/wn-v3-baseline.log"
          test "$result" = 1
          grep -F '36 failed, 40 passed' "$RUNNER_TEMP/wn-v3-baseline.log"
      - run: sh scripts/ci_offline_tests.sh make verify
      - name: V3 unchanged suite with real high descriptors
        run: sh scripts/ci_offline_tests.sh uv run python scripts/wn_v3_high_fd_suite.py
      - name: Validate effective deployment configuration
        env:
          KPV3_HOSTNAME: ci.invalid
        run: docker compose config --quiet
      - run: sh -n deploy/oracle/install.sh deploy/oracle/backup.sh deploy/oracle/restore-drill.sh deploy/ubuntu/prepare-host.sh deploy/runtime-smoke.sh
  hardened-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start hardened Redis and repeatedly probe NATS
        run: sh deploy/runtime-smoke.sh
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        volumes:
          - /tmp/wn-ci-postgres-socket:/var/run/postgresql
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalsh3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - name: Install PostgreSQL test runner
        run: uv pip install pytest
      - run: test -S /tmp/wn-ci-postgres-socket/.s.PGSQL.5432
      - run: sh scripts/ci_offline_tests.sh uv run pytest -q -m postgres
        env:
          KALSH3_TEST_POSTGRES_DSN: host=/tmp/wn-ci-postgres-socket dbname=kalsh3_test user=postgres
  security-and-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - name: Bandit full report
        continue-on-error: true
        run: uv run bandit -c pyproject.toml -r services
      - name: Bandit high-severity gate
        run: uv run bandit -c pyproject.toml -r services --severity-level=high
      - run: uv run detect-secrets scan --all-files
      - run: uvx pip-audit
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
