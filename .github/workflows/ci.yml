name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Install CI verification tools
        run: uv pip install ruff mypy pytest
      - run: make verify
      - run: docker compose config --quiet
      - run: sh -n deploy/oracle/install.sh deploy/oracle/backup.sh deploy/oracle/restore-drill.sh
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalsh3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - name: Install PostgreSQL test runner
        run: uv pip install pytest
      - run: uv run pytest -q -m postgres
        env:
          KALSH3_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/kalsh3_test
  security-and-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-groups
      - name: Bandit full report
        continue-on-error: true
        run: uvx bandit -c pyproject.toml -r services
      - name: Bandit high-severity gate
        run: uvx bandit -c pyproject.toml -r services --severity-level=high
      - run: uvx detect-secrets scan --all-files
      - run: uvx pip-audit
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
