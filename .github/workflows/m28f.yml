name: m28f

on:
  pull_request:
    paths:
      - services/production_weather_strategy/execution_learning.py
      - tests/test_m28f_execution_learning.py
      - .github/workflows/m28f.yml

permissions:
  contents: read

jobs:
  behavioral-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Install deterministic verification tools
        run: uv pip install ruff==0.16.3 mypy pytest
      - name: Lint M28F scope
        run: >-
          uv run ruff check
          services/production_weather_strategy/execution_learning.py
          tests/test_m28f_execution_learning.py
      - name: Verify M28F formatting
        run: >-
          uv run ruff format --check
          services/production_weather_strategy/execution_learning.py
          tests/test_m28f_execution_learning.py
      - name: Strict M28F type verification
        run: uv run mypy services/production_weather_strategy/execution_learning.py
      - name: Focused M28F tests
        run: uv run pytest -q tests/test_m28f_execution_learning.py
