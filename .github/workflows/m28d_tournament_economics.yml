name: m28d-tournament-economics

on:
  pull_request:
    paths:
      - services/production_weather_strategy/tournament_economics.py
      - tests/test_m28d_tournament_economics.py
      - .github/workflows/m28d_tournament_economics.yml

permissions:
  contents: read

jobs:
  behavioral-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Install deterministic verification tools
        run: uv pip install ruff==0.16.3 mypy pytest
      - name: Diagnose Ruff import normalization
        run: |
          uv run ruff check --fix services/production_weather_strategy/tournament_economics.py tests/test_m28d_tournament_economics.py
          git diff -- services/production_weather_strategy/tournament_economics.py tests/test_m28d_tournament_economics.py
          git diff --exit-code -- services/production_weather_strategy/tournament_economics.py tests/test_m28d_tournament_economics.py
      - name: Verify formatting
        run: >-
          uv run ruff format --check
          services/production_weather_strategy/tournament_economics.py
          tests/test_m28d_tournament_economics.py
      - name: Strict type verification
        run: >-
          uv run mypy
          services/production_weather_strategy/tournament_economics.py
      - name: Focused tests
        run: >-
          uv run pytest -q
          tests/test_m28d_forecast_vintage_economics.py
          tests/test_m28d_tournament_economics.py
