name: PR268 offline exception diagnosis
on:
  push:
    branches: [research/pr268-host-exception-diagnosis-20261106]
permissions:
  contents: read
jobs:
  diagnostic-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - run: uv pip install ruff mypy pytest
      - name: Static and observer verification
        run: |
          uv run ruff check diagnostics/pr268
          uv run ruff format --check diagnostics/pr268
          uv run mypy --strict diagnostics/pr268/host_exception_plugin.py
      - name: Same-host network-denied controls
        run: bash diagnostics/pr268/run_controls.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr268-exception-diagnosis
          path: diagnostic-results/
          if-no-files-found: error

