[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-production-v3"
version = "0.1.0"
description = "Safety-first prediction-market research and execution platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets==16.1.1",
]

[project.optional-dependencies]
# WN-A1 real WeatherNext GCS Zarr reader only (services.forecasting.wn_a1_weathernext_
# evidence.gcs_zarr_reader). Not required to run WN-A1's tests, which inject a fake
# in-memory reader. Live-verified 2026-09-21 against gs://weathernext3_spatial -- see the
# WN-A1 review doc.
weathernext = [
    "gcsfs==2026.8.1",
    "zarr==3.4.0",
    "google-cloud-storage==3.14.1",
    # Bounded prefix decoding of the ~0.47 GB single-frame zstd chunks (streaming decode);
    # pinned to the version the 2026-09-21 live verification ran with.
    "zstandard==0.25.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = ["postgres: PostgreSQL transaction-contract and integration coverage"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603"]
"services/web_dashboard/app.py" = ["E501"]
"services/web_dashboard/store.py" = ["E501", "S101"]
"services/risk_engine/authorization.py" = ["E501"]
"services/risk_engine/domain.py" = ["S105"]
"services/demo_execution/**" = ["E501"]
"services/production_execution/security_boundary.py" = ["S603"]
"services/production_execution/store.py" = ["E501"]
"services/supervised_canary/store.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["services"]

# This scorer was frozen before outcome exposure; edits after exposure are
# prohibited.  The later CI check found one static return-Any issue, so keep
# the scientific seal intact with the narrowest module-specific exception.
[[tool.mypy.overrides]]
module = ["services.forecasting.cpi_p10d_sealed_scorer"]
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests"]
